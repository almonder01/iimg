[package]
name = "iimg-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Experimental IIMG binary container parser"

[dependencies]
base64 = "0.22.1"
miniz_oxide = "0.8.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
