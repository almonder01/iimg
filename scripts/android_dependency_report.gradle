import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.UnresolvedDependencyResult

gradle.projectsEvaluated {
    def root = gradle.rootProject
    root.tasks.register("iimgAndroidDependencyReport") {
        doLast {
            def report = [:]
            [":app", ":handoffFixture"].each { path ->
                def project = root.project(path)
                def scopes = [
                    "build tools": project.buildscript.configurations.getByName("classpath"),
                    "debug runtime": project.configurations.getByName("debugRuntimeClasspath"),
                    "release runtime": project.configurations.getByName("releaseRuntimeClasspath"),
                ]
                scopes.each { label, configuration ->
                    def result = configuration.incoming.resolutionResult
                    def unresolved = result.allDependencies.findAll { it instanceof UnresolvedDependencyResult }
                    if (!unresolved.empty) {
                        throw new GradleException("Unresolved dependencies for ${path} ${label}: ${unresolved}")
                    }
                    report["${path} ${label}".toString()] = result.allComponents
                        .collect { it.id }
                        .findAll { it instanceof ModuleComponentIdentifier }
                        .collect { [name: "${it.group}:${it.module}".toString(), version: it.version] }
                        .sort { a, b -> (a.name <=> b.name) ?: (a.version <=> b.version) }
                }
            }
            def output = root.layout.buildDirectory.file("reports/iimg-dependencies.json").get().asFile
            output.parentFile.mkdirs()
            output.setText(JsonOutput.prettyPrint(JsonOutput.toJson(report)) + "\n", "UTF-8")
            println("Wrote ${output}")
        }
    }
}
