pluginManagement {
    plugins {
        id "com.android.application" version "9.5.0"
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "IIMG Android Viewer"
include(":app")
include(":handoffFixture")

// Keep these overrides scoped to the build classpath until AGP supplies fixed versions.
gradle.beforeProject { project ->
    project.buildscript.configurations.named("classpath") {
        resolutionStrategy.force(
            "com.google.guava:guava:33.7.2-jre",
            "org.apache.commons:commons-lang3:3.18.0",
            "org.bitbucket.b_c:jose4j:0.9.6",
            "org.bouncycastle:bcpkix-jdk18on:1.85",
            "org.bouncycastle:bcprov-jdk18on:1.85",
            "org.jdom:jdom2:2.0.6.1",
            "org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.20",
        )
    }
}
