plugins {
    id "com.android.application"
}

android {
    namespace "org.iimg.handoff"
    compileSdk 35
    buildToolsVersion "36.0.0"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "org.iimg.handoff"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
        manifestPlaceholders = [iimgFixtureLabel: "IIMG test sources"]
    }

    buildTypes {
        candidate {
            initWith debug
            applicationIdSuffix ".rc"
            versionNameSuffix "-rc.1"
            matchingFallbacks = ["debug"]
            manifestPlaceholders = [iimgFixtureLabel: "IIMG RC test sources"]
        }
    }

    androidResources {
        noCompress += "iimg"
    }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir("generated/fixtures").get().asFile)
}

def stageFixture = tasks.register("stageFixture", Sync) {
    from(rootProject.file("../../tests/fixtures/v0.2/two-controls.iimg"))
    from(rootProject.file("../../tests/fixtures/v0.2/lamp.iimg"))
    from(rootProject.file("../../tests/fixtures/motion/motion.iimg"))
    from(rootProject.file("../../tests/fixtures/drag/drag.iimg"))
    from(rootProject.file("../..")) {
        include("LICENSE", "NOTICE", "LICENSES.md", "LICENSE-CC-BY-4.0")
    }
    into(layout.buildDirectory.dir("generated/fixtures"))
}
tasks.named("preBuild").configure { dependsOn(stageFixture) }
