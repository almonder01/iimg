plugins {
    id "com.android.application"
}

def signingVariables = ["IIMG_ANDROID_KEYSTORE", "IIMG_ANDROID_STORE_PASSWORD", "IIMG_ANDROID_KEY_ALIAS", "IIMG_ANDROID_KEY_PASSWORD"]
if (providers.gradleProperty("iimgBuildDirectory").isPresent()) {
    layout.buildDirectory.set(file(providers.gradleProperty("iimgBuildDirectory").get()))
}
def signingValues = signingVariables.collectEntries { name -> [(name): providers.environmentVariable(name).orNull] }
def verifyReleaseSigning = tasks.register("verifyReleaseSigning") {
    doLast {
        if (signingValues.values().any { it == null || it.isEmpty() }) {
            throw new GradleException("Release signing requires all IIMG_ANDROID_KEYSTORE/STORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD environment variables. Debug builds are test-only.")
        }
        if (!file(signingValues.IIMG_ANDROID_KEYSTORE).isFile()) {
            throw new GradleException("The configured release keystore file does not exist.")
        }
    }
}

android {
    namespace "org.iimg.viewer"
    compileSdk 35
    buildToolsVersion "36.0.0"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "org.iimg.viewer"
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName "1.0.0-rc.1"
        manifestPlaceholders = [iimgAppLabel: "IIMG Viewer"]
    }

    signingConfigs {
        release {
            if (signingValues.IIMG_ANDROID_KEYSTORE) storeFile file(signingValues.IIMG_ANDROID_KEYSTORE)
            storePassword signingValues.IIMG_ANDROID_STORE_PASSWORD
            keyAlias signingValues.IIMG_ANDROID_KEY_ALIAS
            keyPassword signingValues.IIMG_ANDROID_KEY_PASSWORD
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release }
        candidate {
            initWith debug
            applicationIdSuffix ".rc"
            matchingFallbacks = ["debug"]
            manifestPlaceholders = [iimgAppLabel: "IIMG Viewer RC"]
        }
    }

    sourceSets.main.assets.srcDir(layout.buildDirectory.dir("generated/iimgAssets").get().asFile)
}

def wasm = rootProject.file("../../target/wasm32-unknown-unknown/release/iimg_web.wasm")
def stageViewer = tasks.register("stageViewer", Sync) {
    from(rootProject.file("../web")) {
        include("index.html", "viewer.mjs")
    }
    from(wasm)
    from(rootProject.file("../..")) {
        include("LICENSE", "NOTICE", "LICENSES.md", "LICENSE-CC-BY-4.0")
    }
    into(layout.buildDirectory.dir("generated/iimgAssets"))
    doFirst {
        if (!wasm.isFile()) {
            throw new GradleException("Build iimg-web for wasm32-unknown-unknown in release mode first.")
        }
    }
}
tasks.named("preBuild").configure { dependsOn(stageViewer) }
tasks.matching { it.name in ["preReleaseBuild", "validateSigningRelease"] }.configureEach {
    dependsOn(verifyReleaseSigning)
}
