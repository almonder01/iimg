name: Bug report
description: Report a reproducible defect
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps and minimal sample (no secrets)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: IIMG version, OS and runtime
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and additional context
