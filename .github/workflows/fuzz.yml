name: Sanitizer fuzzing
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per fuzz target (1–600)"
        type: string
        default: "600"
  schedule:
    - cron: "32 3 * * 2"
permissions:
  contents: read
jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --version 0.12.0 --locked
      - run: cargo fetch --locked --manifest-path fuzz/Cargo.toml
      - run: |
          mkdir -p fuzz/corpus/decode
          cp examples/hello.iimg tests/fixtures/v0.2/*.iimg tests/fixtures/v1.0/*.iimg tests/fixtures/state-actions/*.iimg tests/fixtures/motion/*.iimg tests/fixtures/drag/*.iimg fuzz/corpus/decode/
          mkdir -p fuzz/corpus/author
          cp examples/*.source.json fuzz/corpus/author/
      - name: Fuzz decoder and authoring under AddressSanitizer
        shell: bash
        run: |
          if [[ ! "$IIMG_FUZZ_SECONDS" =~ ^[1-9][0-9]{0,2}$ ]] || (( IIMG_FUZZ_SECONDS > 600 )); then
            echo 'seconds must be an integer from 1 through 600'
            exit 1
          fi
          mkdir -p target
          cargo +nightly fuzz run decode -- -max_len=65537 -max_total_time="$IIMG_FUZZ_SECONDS" 2>&1 | tee target/fuzz-decode.log
          cargo +nightly fuzz run author -- -max_len=65536 -max_total_time="$IIMG_FUZZ_SECONDS" 2>&1 | tee target/fuzz-author.log
        env:
          IIMG_FUZZ_SECONDS: ${{ inputs.seconds || '600' }}
          CARGO_NET_OFFLINE: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iimg-fuzz-evidence
          path: |
            target/fuzz-*.log
            fuzz/artifacts/
          if-no-files-found: warn
