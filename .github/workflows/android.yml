name: Android APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/**"
      - "viewers/**"
      - "Cargo.*"
      - "scripts/check_android_apk.py"
      - "scripts/test_android_handoff.py"
      - "scripts/test_android_webview.mjs"
      - ".github/workflows/android.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sdkmanager "platforms;android-35" "build-tools;36.0.0"
      - run: cargo build --locked --release --target wasm32-unknown-unknown -p iimg-web
      - run: gradle -p viewers/android :app:assembleDebug :handoffFixture:assembleDebug --no-daemon
      - run: |
          apk=viewers/android/app/build/outputs/apk/debug/app-debug.apk
          python -B scripts/check_android_apk.py "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          sha256sum "$apk" > "$apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: iimg-android-debug
          path: viewers/android/app/build/outputs/apk/debug/app-debug.apk*
          if-no-files-found: error
